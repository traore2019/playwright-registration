image: mcr.microsoft.com/playwright:v1.55.0-noble

stages:
  - test
  - report
  - deploy

cache:
  key:
    files:
      - package-lock.json
  paths:
    - .npm/

variables:
  npm_config_cache: "$CI_PROJECT_DIR/.npm"

playwright_tests:
  stage: test
  script:
    - npm ci --cache .npm --prefer-offline
    - npx playwright test
  artifacts:
    when: always
    expire_in: 7 days
    paths:
      - playwright-report/
      - test-results/
      - allure-results/

allure_report:
  stage: report
  needs:
    - job: playwright_tests
      artifacts: true
  script:
    - npm ci --cache .npm --prefer-offline
    - npx allure generate allure-results --clean -o public
  artifacts:
    when: always
    expire_in: 7 days
    paths:
      - public/

pages:
  stage: deploy
  needs:
    - job: allure_report
      artifacts: true
  script:
    - echo "Publishing Allure report to GitLab Pages"
  pages: true
  artifacts:
    paths:
      - public
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
